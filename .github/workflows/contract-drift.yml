name: contract-drift

# The spec schema is the sole contract (ADR-0007). TypeScript, C#, and Go types are
# all generated from `packages/spec/lazarus.schema.json`.
#
# This job regenerates everything and fails on any diff. That is what makes
# "the spec is the contract" enforceable rather than aspirational: change the
# schema without regenerating, and this fails.
#
# It runs as its own workflow, separate from CI, so a contract violation is
# reported as a contract violation instead of as a build failure.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY A `detect` JOB INSTEAD OF hashFiles
#
# `hashFiles()` is NOT permitted in a job-level `if:`. Per GitHub's context
# availability table, `jobs.<job_id>.if` allows only `always`, `cancelled`,
# `success`, and `failure`. `hashFiles` is available at `jobs.<job_id>.steps.*`
# only. Using it at job level is a workflow parse error.
#
# A step-level preflight with `exit 0` is also wrong: `exit 0` ends that STEP, and
# every later step in the job still runs.
#
# So detection happens once, in a job that checks out the tree and publishes
# whether the schema exists. Downstream jobs gate on that output. This mirrors
# `just codegen`'s guards in the justfile.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # `packages/spec/**` and `packages/contracts/**` cover all three schemas.
    # The C# and Go paths below do not exist yet; they are listed so that landing a
    # generator for them cannot silently escape this check.
    paths:
      - 'packages/spec/**'
      - 'packages/contracts/**'
      - 'apps/control-plane/src/Lazarus.Modules.Specs/**'
      - 'apps/cli/internal/spec/**'
      - 'tools/codegen/**'
      - '.github/workflows/contract-drift.yml'
  pull_request:
    paths:
      - 'packages/spec/**'
      - 'packages/contracts/**'
      - 'apps/control-plane/src/Lazarus.Modules.Specs/**'
      - 'apps/cli/internal/spec/**'
      - 'tools/codegen/**'
      - '.github/workflows/contract-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect schema
    runs-on: ubuntu-latest
    outputs:
      schema: ${{ steps.detect.outputs.schema }}
    steps:
      - uses: actions/checkout@v7

      - name: Check whether the schemas exist
        id: detect
        run: |
          set -euo pipefail
          schemas="
          packages/spec/lazarus.schema.json
          packages/contracts/src/schema/interaction.schema.json
          packages/contracts/src/schema/session.schema.json
          "
          missing=0
          present=0
          for f in $schemas; do
            if [ -f "$f" ]; then
              present=$((present + 1))
              echo "  $f: present"
            else
              missing=$((missing + 1))
              echo "  $f: absent"
            fi
          done
          echo "  $present of 3 present, $missing missing"
          # All-or-nothing. A partially built contract set is a broken repository,
          # not a state to verify, because a schema without its tests passes CI by
          # simply not existing.
          if [ "$missing" -eq 0 ]; then
            echo "schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema=false" >> "$GITHUB_OUTPUT"
            echo "::error::The contract set is incomplete. Downstream jobs are skipped."
          fi

  drift:
    name: No drift from the schema
    # Not an error before Phase 2: there is no contract yet to have drifted from.
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: pnpm install --frozen-lockfile

      # `just codegen` is the single cross-language entry point (ADR-0009), so the
      # pinned just must be present or the recipe fails with "just: command not
      # found". `pnpm codegen` alone would skip the justfile's guards.
      - name: Install pinned just
        uses: ./.github/actions/setup-just

      - name: Record the pre-generation tree
        run: |
          set -euo pipefail
          # Record checksums so a generator that produces different output on a
          # clean checkout versus a warm one is caught too.
          find packages/spec packages/contracts apps/cli/internal/spec \
            -type f -name '*.*' 2>/dev/null | sort | xargs -r sha256sum > /tmp/before.txt || true
          cat /tmp/before.txt

      - name: Regenerate
        run: |
          set -euo pipefail
          just codegen

      - name: Fail on any drift
        run: |
          set -euo pipefail
          changed="$(git status --porcelain packages/spec packages/contracts apps/cli/internal/spec apps/control-plane)"
          if [ -z "$changed" ]; then
            echo "No drift. Generated output matches the schemas."
            exit 0
          fi
          echo "::error::Generated code is out of date with its schema."
          echo "Generated code is never hand-edited (AGENTS.md §4.7). Run 'just codegen' and commit the result."
          git --no-pager diff --stat
          git --no-pager diff
          exit 1

      - name: Codegen is idempotent
        run: |
          set -euo pipefail
          just codegen
          changed="$(git status --porcelain packages/spec packages/contracts apps/cli/internal/spec)"
          if [ -n "$changed" ]; then
            echo "::error::Codegen is not idempotent. Running it twice changed the output."
            git --no-pager diff
            exit 1
          fi
          echo "Codegen is idempotent."

  docs:
    name: A schema change ships with its reference-doc update
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs against the PR base, which a shallow clone
      # cannot resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # AGENTS.md §4.6: a schema change ships with its regeneration AND its
      # reference-doc update. The reference is hand-written prose derived from the
      # schema, so it cannot be verified by regeneration — only by requiring that
      # the author updated it alongside the schema. That is a weaker guarantee than
      # "generated", and it is the honest one.
      #
      # Deliberately git-only: no toolchain is needed to compare two commits, so
      # this job cannot fail for an unrelated install problem.
      - name: Schema change implies a reference change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "No base SHA available (workflow_dispatch); nothing to compare."
              exit 0
              ;;
          esac

          schemas=(
            packages/spec/lazarus.schema.json
            packages/contracts/src/schema/interaction.schema.json
            packages/contracts/src/schema/session.schema.json
          )
          references=(
            docs/experience-reference.md
            docs/contracts-reference.md
          )

          changed_schemas=()
          for f in "${schemas[@]}"; do
            if [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- "$f")" ]; then
              changed_schemas+=("$f")
            fi
          done

          if [ "${#changed_schemas[@]}" -eq 0 ]; then
            echo "No schema changed. No reference update required."
            exit 0
          fi

          echo "Schema changed in this change:"
          printf '  %s\n' "${changed_schemas[@]}"

          for f in "${references[@]}"; do
            if [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- "$f")" ]; then
              echo "Reference updated alongside it: $f"
              exit 0
            fi
          done

          echo "::error::A schema changed without a reference-doc update (AGENTS.md §4.6)."
          echo "Update docs/experience-reference.md or docs/contracts-reference.md in the same change."
          echo "A schema change without its reference fails here; without regeneration it fails in 'No drift from the schemas'."
          exit 1
