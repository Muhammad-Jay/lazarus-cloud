name: CI

# The gate. One command, locally and here: `just check`.
#
# Jobs are conditional on the code existing. The repository is built bottom-up, so
# for a long while there is no TypeScript and no .NET solution. A CI run that fails
# because a project has not been scaffolded yet trains people to ignore CI, which
# is the opposite of what CI is for.
#
# What is NOT conditional: `contract-drift`, `secrets`, and `hygiene`. Those apply
# from the first commit.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY A `detect` JOB INSTEAD OF hashFiles
#
# `hashFiles()` is NOT permitted in a job-level `if:`. Per GitHub's context
# availability table, `jobs.<job_id>.if` allows only the functions
# `always`, `cancelled`, `success`, and `failure`. `hashFiles` is available at
# `jobs.<job_id>.steps.*` only. Using it here is a workflow parse error.
#
# A step-level preflight with `exit 0` is also wrong: `exit 0` ends that STEP, and
# every later step in the job still runs.
#
# So detection happens once, in a job that checks out the tree and publishes its
# findings as outputs. Downstream jobs gate on `needs.detect.outputs.*`. This also
# mirrors the `ts_projects` and `cp` variables in the justfile, so local and CI
# cannot disagree about what exists.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Detection ─────────────────────────────────────────────────────────────

  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.detect.outputs.typescript }}
      go: ${{ steps.detect.outputs.go }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v7

      - name: Inspect the tree
        id: detect
        run: |
          set -euo pipefail

          # TypeScript: any workspace package manifest. Mirrors `ts_projects` in
          # the justfile.
          if ls apps/web/package.json services/auth/package.json packages/*/package.json >/dev/null 2>&1; then
            echo "typescript=true"  >> "$GITHUB_OUTPUT"
            echo "  typescript: true"
          else
            echo "typescript=false" >> "$GITHUB_OUTPUT"
            echo "  typescript: false (no workspace packages yet)"
          fi

          # Go: the CLI module. Mirrors the `[ -d apps/cli ]` guard.
          if [ -f apps/cli/go.mod ]; then
            echo "go=true"  >> "$GITHUB_OUTPUT"
            echo "  go: true"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "  go: false (no CLI module yet)"
          fi

          # .NET: a real solution file, not merely a directory. `dotnet format` on a
          # directory with no solution exits 128 with an unhandled exception.
          #
          # Each extension is probed with `compgen -G` separately. A single
          # `ls *.sln *.slnx` cannot be used here: ls exits non-zero when *any*
          # operand is missing, so once a .sln exists but a .slnx does not, the
          # condition would be permanently false and the .NET jobs would never run
          # again — silently, with no failing run to notice.
          if compgen -G "apps/control-plane/*.sln" >/dev/null \
            || compgen -G "apps/control-plane/*.slnx" >/dev/null; then
            echo "dotnet=true"  >> "$GITHUB_OUTPUT"
            echo "  dotnet: true"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
            echo "  dotnet: false (no solution yet)"
          fi

          echo "Detection complete. Skipped jobs are reported as 'skipped', not as passes."

  # ── Baseline ──────────────────────────────────────────────────────────────

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed build output
        run: |
          if git ls-files --error-unmatch '**/node_modules' >/dev/null 2>&1; then
            echo "::error::node_modules is committed"
            exit 1
          fi
          if git ls-files --error-unmatch '**/bin' >/dev/null 2>&1; then
            echo "::error::bin/ output is committed"
            exit 1
          fi
          if git ls-files --error-unmatch '**/obj' >/dev/null 2>&1; then
            echo "::error::obj/ output is committed"
            exit 1
          fi
          if git ls-files --error-unmatch '**/.env' >/dev/null 2>&1; then
            echo "::error::a .env file is committed. See AGENTS.md."
            exit 1
          fi

      # Pinned to the .tool-versions version, because `just --fmt --check` is a gate
      # and the formatter's output is not stable across releases. Installing
      # "latest" would let a new just release fail this job on an unmodified file.
      - name: justfile is formatted
        run: |
          set -euo pipefail
          just_version="$(awk '$1 == "just" { print $2 }' .tool-versions)"
          if [ -z "$just_version" ]; then
            echo "::error::no just pin found in .tool-versions"
            exit 1
          fi
          curl -sSfL https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin" --tag "$just_version"
          installed="$("$HOME/.local/bin/just" --version | awk '{ print $2 }')"
          echo "pinned:   $just_version"
          echo "installed: $installed"
          if [ "$installed" != "$just_version" ]; then
            echo "::error::installed just ($installed) does not match the pin ($just_version)"
            exit 1
          fi
          "$HOME/.local/bin/just" --fmt --unstable --check

      # A contributor on one SDK and CI on another produces failures that look like
      # bugs in the code. The two pins must agree (see .tool-versions).
      - name: dotnet pin matches global.json
        run: |
          set -euo pipefail
          toolversions="$(awk '$1 == "dotnet" { print $2 }' .tool-versions)"
          globaljson="$(python3 -c "import json;print(json.load(open('global.json'))['sdk']['version'])")"
          if [ -z "$toolversions" ]; then
            echo "::error::no dotnet pin found in .tool-versions"
            exit 1
          fi
          echo ".tool-versions: $toolversions"
          echo "global.json:    $globaljson"
          if [ "$toolversions" != "$globaljson" ]; then
            echo "::error::dotnet pin mismatch. Update .tool-versions or global.json so they agree."
            exit 1
          fi
          echo "dotnet pins agree."

  # ── TypeScript ────────────────────────────────────────────────────────────

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm -r fmt-check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  # ── Go ────────────────────────────────────────────────────────────────────

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.go == 'true'
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: apps/cli/coverage.out
          retention-days: 7

  # ── .NET ──────────────────────────────────────────────────────────────────

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --verbosity quiet

      - name: Build (warnings are errors)
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: apps/control-plane/TestResults
          retention-days: 7

  # ── Security ──────────────────────────────────────────────────────────────

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The previous implementation leaked a GitHub PAT into source. This job is
      # the reason that cannot recur unnoticed.
      #
      # GITLEAKS_CONFIG is set explicitly rather than relying on auto-detection:
      # the action's documentation is ambiguous about whether the dotfile
      # `.gitleaks.toml` or `gitleaks.toml` is auto-detected, and guessing wrong
      # would silently fall back to the default ruleset. `just secrets` passes the
      # same path via --config, so local and CI read one config.
      - name: Scan history and tree
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the build rather than annotating, so a leak blocks a merge.
          # No SARIF upload: a leaked value must not end up in an artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # NOTE: gitleaks-action requires a free GITLEAKS_LICENSE for repositories
      # owned by an *organisation*. Personal accounts do not need one. If this
      # repo moves to an org, add the license as an encrypted secret or this job
      # will start failing.

  policy:
    name: Policy chokepoint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      # Runtime and Exec code reachable without a PolicyEvaluator decision is a
      # build failure (AGENTS.md §4.5). The architecture tests run here as their own
      # job so an escape in the boundary is never hidden inside a passing test run.
      - name: Architecture tests
        run: |
          dotnet test \
            --filter 'FullyQualifiedName~ArchitectureTests' \
            --logger 'trx;LogFileName=architecture.trx' \
            --results-directory ./TestResults

      - name: Policy decision matrix
        run: |
          dotnet test \
            --filter 'FullyQualifiedName~PolicyEvaluatorTests' \
            --logger 'trx;LogFileName=policy.trx' \
            --results-directory ./TestResults

      - name: Upload policy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-test-results
          path: apps/control-plane/TestResults
          retention-days: 14

  # ── Integration ───────────────────────────────────────────────────────────

  integration:
    name: Integration (real Postgres, real podman)
    runs-on: ubuntu-latest
    # Needs rootless podman. Separate from the unit jobs because it is slow and
    # needs a different runner capability.
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

      - name: Start rootless podman
        run: |
          sudo systemctl enable --now podman.socket
          podman info

      - run: dotnet restore

      - name: Integration tests
        run: dotnet test -c Release --filter 'Category=Integration'

  # ── Summary ───────────────────────────────────────────────────────────────

  required:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [detect, hygiene, typescript, go, dotnet, secrets, policy]
    # Skipped jobs are not failures. Until the .NET solution exists, `dotnet` and
    # `policy` do not run, and the branch is not blocked by their absence.
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Verify no required job failed
        env:
          DETECT: ${{ needs.detect.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          GO: ${{ needs.go.result }}
          DOTNET: ${{ needs.dotnet.result }}
          SECRETS: ${{ needs.secrets.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          set -euo pipefail

          failed=0
          for job in DETECT HYGIENE TYPESCRIPT GO DOTNET SECRETS POLICY; do
            result="${!job}"
            printf '  %-11s %s\n' "${job,,}" "$result"
            case "$result" in
              failure|cancelled)
                echo "::error::${job,,} did not pass (${result})"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs passed or were skipped."
          echo "A 'skipped' language job means that component does not exist yet — it is not a pass."
