# Lazarus — pnpm workspace
#
# pnpm is the only package manager. Do not add npm/yarn lockfiles (see
# `.gitattributes`, which treats them as generated noise).
#
# `catalog:` below pins dependency versions in ONE place. Packages reference
# catalogued deps as `"react": "catalog:"`, so a security bump is a single edit
# plus a lockfile refresh, not N edits that drift apart.

packages:
  - 'apps/web'
  - 'services/auth'
  - 'packages/*'

# Shared, centrally-pinned dependency versions.
# Add a dependency here rather than pinning a version inline in a package, unless
# the pin is deliberately package-specific — in which case add a comment saying why.
catalog:
  '@types/node': ^24.0.0
  '@types/react': ^19.1.0
  '@types/react-dom': ^19.1.0
  ajv: ^8.17.1
  ajv-formats: ^3.0.1
  json-schema-to-typescript: ^16.0.0
  typescript: ^5.9.0
  vitest: ^3.2.4
  zod: ^4.0.0
  eslint: ^9.20.0
  '@eslint/js': ^9.20.0
  'typescript-eslint': ^8.24.0
  'eslint-plugin-import': ^2.31.0
  'eslint-plugin-unused-imports': ^4.1.4
  prettier: ^3.4.2
  '@vitest/coverage-v8': ^3.2.4
  '@next/eslint-plugin-next': ^15.5.3
  jsdom: ^26.0.0
